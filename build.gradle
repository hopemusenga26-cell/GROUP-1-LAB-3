plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'zm.ac.mu.ict261'
version = '1.0'

repositories {
    mavenCentral()
}

java {
    // Compile with whichever JDK is running Gradle (e.g. JDK 25) instead of
    // requiring a separate JDK 21 installation, but still target Java 21
    // bytecode so the project stays compatible with Java 21.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'   // the source uses ★, − and ’ characters
}

tasks.named('test') {
    useJUnitPlatform()
}

javafx {
    version = '21.0.5'
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'   // receipts saved as PDF
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.16'   // silences sqlite-jdbc's "no SLF4J provider" warning
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'lodgebilling.LodgeBillingApp'   // gradle run; in IntelliJ run Launcher
}
